services:
  app:
    build: .
    container_name: hr-its-app
    restart: always
    env_file:
      - .env
    ports:
      - "3005:3000" # Opsional: Jika ingin akses langsung bypass Nginx untuk testing

  nginx:
    image: nginx:alpine
    container_name: hr-its-nginx
    restart: always
    ports:
      - "8089:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
